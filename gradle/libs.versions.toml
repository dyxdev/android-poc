[versions]
# Fijadas por decisión de Andy (2026-10-13): Mux Player 1.6.0 + Media3 1.11.0.
# Mux Data 1.13.2 llega como transitiva de Mux Player (artefacto data-media3-at_1_11).
muxPlayer = "1.6.0"
media3 = "1.11.0"
# assembleDebug compila con estas versiones en Codespace (2026-10-14); ver docs/informe.md §1.
agp = "8.13.2"
kotlin = "2.1.20"
hilt = "2.56.2"
# BOM 2026.06.01 = compose-ui 1.11.4 (minCompileSdk 35). Las BOM 2026.08.00+ (compose 1.12.x) exigen compileSdk 37 y AGP 9.1.
composeBom = "2026.06.01"
activityCompose = "1.10.1"
lifecycle = "2.9.0"
datastore = "1.1.7"
coroutines = "1.10.2"
timber = "5.0.1"
# ADR-AND-0008. Última publicada en Maven Central (consultado 2026-10-14).
appauth = "0.11.1"
# ADR-AND-0013. La última compatible con Kotlin 2.1.20 y AGP 8.13: de la 3.4.0 en adelante exigen stdlib 2.3+ y la
# 3.6.3 arrastra Compose 1.12 (pide AGP 9.1). Medido en el build del Codespace y en los .module de Maven Central, 2026-10-15.
coil = "3.3.0"
# ADR-AND-0003. 2.9.8 (minCompileSdk 35, minAGP 8.6); la 2.10.x exige AGP 9.1. Dependencias medidas en sus .module: lifecycle 2.9.0,
# savedstate 1.3.0 y compose 1.7.2 como mínimos (la BOM manda), 2026-10-15.
navigation = "2.9.8"
# Rutas tipadas. kotlinx-serialization-core 1.8.1 depende de kotlin-stdlib 2.1.20 (medido en su .module, 2026-10-15).
serialization = "1.8.1"
junit = "4.13.2"
turbine = "1.2.1"
ktlintGradle = "12.1.2"
detekt = "1.23.8"

[libraries]
mux-player = { group = "com.mux.player", name = "android", version.ref = "muxPlayer" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version = "1.2.0" }
material3 = { group = "androidx.compose.material3", name = "material3" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }
appauth = { group = "net.openid", name = "appauth", version.ref = "appauth" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
androidx-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "serialization" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
